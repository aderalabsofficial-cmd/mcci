# Stage 1 for https://themcci.com.pk (docs/acceptance/MCCI-DOMAIN-MIGRATION-READINESS.md §2, staged 7 Nov 2026, NOT
# installed): port 80 only, answers the Let's Encrypt challenge from the shared webroot and 404s everything else.
# Proxies nothing. Install only after the owner points themcci.com.pk and www (A record, DNS only / grey cloud) at this
# server, then: certbot certonly --webroot -w /var/www/letsencrypt -d themcci.com.pk -d www.themcci.com.pk
# Target: /etc/nginx/conf.d/themcci.com.pk.conf (nginx 1.20.1). Rollback: remove the file, nginx -t, reload.
server {
    listen 80;
    listen [::]:80;
    server_name themcci.com.pk www.themcci.com.pk;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}
