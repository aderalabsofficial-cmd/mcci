# Stage 2 for https://app.mcci.aderalabs.tech (docs/20-deployment-plan.md): the real MCCI app beside the demo on
# mcci.aderalabs.tech. Target: /etc/nginx/conf.d/app.mcci.aderalabs.tech.conf (nginx 1.20.1), after
#   certbot certonly --webroot -w /var/www/letsencrypt -d app.mcci.aderalabs.tech
# Rollback: put the stage-1 file back (or remove this one), nginx -t, systemctl reload nginx.
#
#   /rest|auth|storage|realtime/v1/  → Supabase gateway 127.0.0.1:18000 (same rules as docs/18 §5: X-Real-IP and
#                                      X-Forwarded-For OVERWRITTEN with the real client, websockets for Realtime)
#   /realtime/v1/api/, /functions/v1/, /graphql/v1/, /pg/, /mcp, /api/mcp → 404 (never Studio or admin APIs)
#   /email-templates/                → copy of the release's supabase/templates in /var/www (Auth fetches them here;
#                                      /var/www keeps the SELinux web-content label)
#   everything else                  → Next.js on 127.0.0.1:3200 (systemd mcci-web)
# Not indexed until launch (X-Robots-Tag). HSTS without includeSubDomains (other aderalabs.tech hosts stay unaffected).

map $http_upgrade $mcci_app_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.mcci.aderalabs.tech;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.20.1: HTTP/2 is a listen parameter
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.mcci.aderalabs.tech;

    ssl_certificate     /etc/letsencrypt/live/app.mcci.aderalabs.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.mcci.aderalabs.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mcci_app_ssl:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 11m;

    # ───────── Supabase API (gateway on loopback) ─────────
    location ^~ /realtime/v1/api/ {
        return 404;
    }
    location ~ ^/(rest|auth|storage|realtime)/v1/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mcci_app_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location ~ ^/(functions|graphql)/v1/ {
        return 404;
    }
    location ~ ^/(pg|mcp|api/mcp)(/|$) {
        return 404;
    }

    # ───────── Auth email templates (public HTML, no secrets) ─────────
    location ^~ /email-templates/ {
        alias /var/www/mcci-app-email-templates/;
        default_type text/html;
        # add_header here replaces the server-level ones, so repeat those that matter
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ───────── the app ─────────
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
