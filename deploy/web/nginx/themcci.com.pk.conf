# Stage 2 for https://themcci.com.pk (staged 7 Nov 2026, NOT installed; docs/acceptance/MCCI-DOMAIN-MIGRATION-READINESS.md
# §2). Same app and gateway as app.mcci.aderalabs.tech.conf, which stays in place (both hosts serve until the old one is
# redirected). www redirects to the bare domain. Reuses $mcci_app_connection_upgrade, defined (map) in
# app.mcci.aderalabs.tech.conf: install this file only while that one is installed.
# Target: /etc/nginx/conf.d/themcci.com.pk.conf, after the certificate from the stage-1 file exists.
# Rollback: put the stage-1 file back (or remove this one), nginx -t, systemctl reload nginx.
# X-Robots-Tag noindex stays until MCCI announces the site; remove that line at launch.

server {
    listen 80;
    listen [::]:80;
    server_name themcci.com.pk www.themcci.com.pk;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://themcci.com.pk$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.themcci.com.pk;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/themcci.com.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/themcci.com.pk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://themcci.com.pk$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name themcci.com.pk;

    ssl_certificate     /etc/letsencrypt/live/themcci.com.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/themcci.com.pk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mcci_themcci_ssl:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 11m;

    # ───────── Supabase API (gateway on loopback), as app.mcci.aderalabs.tech.conf ─────────
    location ^~ /realtime/v1/api/ {
        return 404;
    }
    location ~ ^/(rest|auth|storage|realtime)/v1/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mcci_app_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location ~ ^/(functions|graphql)/v1/ {
        return 404;
    }
    location ~ ^/(pg|mcp|api/mcp)(/|$) {
        return 404;
    }

    # ───────── Auth email templates (public HTML, no secrets) ─────────
    location ^~ /email-templates/ {
        alias /var/www/mcci-app-email-templates/;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ───────── the app ─────────
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}
