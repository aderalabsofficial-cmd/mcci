# Stage 1 for https://app.mcci.aderalabs.tech (docs/20-deployment-plan.md): port 80 only, answers the Let's Encrypt
# challenge from the shared webroot and 404s everything else. Proxies nothing. Replaced by
# app.mcci.aderalabs.tech.conf once the certificate exists. Target: /etc/nginx/conf.d/app.mcci.aderalabs.tech.conf
# (nginx 1.20.1). Rollback: remove the file, nginx -t, systemctl reload nginx.
server {
    listen 80;
    listen [::]:80;
    server_name app.mcci.aderalabs.tech;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}
