<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MCCI Digital — offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b2a5b; color: #fff;
             font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { margin: 0 0 6px; opacity: .9; }
      .ur { direction: rtl; font-family: 'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', Tahoma, serif; font-size: 19px; line-height: 2; margin-top: 18px; }
      button { margin-top: 22px; min-height: 48px; padding: 0 26px; border: 0; border-radius: 14px; background: #f0c46a; color: #2a1d05; font-weight: 800; font-size: 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>MCCI Digital needs an internet connection. Check your connection and try again.</p>
      <p class="ur">آپ آف لائن ہیں — ایم سی سی آئی ڈیجیٹل کے لیے انٹرنیٹ درکار ہے۔ کنکشن چیک کر کے دوبارہ کوشش کریں۔</p>
      <button type="button" onclick="location.reload()">Try again · دوبارہ کوشش کریں</button>
    </main>
  </body>
</html>
