name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck · lint · unit · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      # After the migrations are approved: supabase start + db reset + `supabase test db` on the full stack (docs/17 T-V3)

      - name: Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (desktop, mobile-360, app-shell; overflow, orphans, axe, tap targets)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload shell screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shell-screenshots
          path: test-results/shells/
          retention-days: 14

  db-security:
    name: Database migrations + pgTAP security tests (rolled back)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - supabase/postgres:17.6.1.136 # self-hosted stack (docs/17 §1)
          - supabase/postgres:17.11.0.004 # Supabase CLI 2.121 local image
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations + seed + every test inside a rolled-back transaction
        run: bash scripts/db/dry-run.sh ${{ matrix.image }}
