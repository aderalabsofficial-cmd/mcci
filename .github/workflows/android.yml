# Android app bundle (docs/15-mobile-app.md): builds the Capacitor shell in mobile/ into an .aab.
# Runs on a tag mobile-v* (production) or by hand (choose the flavour). Signing uses repository secrets only —
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD — never files in git.
# Without them the bundle is built unsigned (fine for checking the build, not for Play upload).
name: android

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      flavour:
        description: production or staging
        required: true
        default: production
        type: choice
        options: [production, staging]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    env:
      MCCI_FLAVOUR: ${{ inputs.flavour || 'production' }}
      APP_URL: ${{ (inputs.flavour == 'staging') && vars.STAGING_APP_URL || 'https://app.mcci.aderalabs.tech' }}
      MCCI_APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '1.0' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci --no-audit --no-fund
      - name: Generate the Android project
        run: |
          npx cap add android
          # docs/15: minSdk 24 (Android 7)
          sed -i 's/minSdkVersion = 23/minSdkVersion = 24/' android/variables.gradle
          npx cap sync android
      - name: Signing (only when the secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No signing secrets: building an UNSIGNED bundle (not uploadable to Play)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mcci.jks"
          echo "MCCI_KEYSTORE=$RUNNER_TEMP/mcci.jks" >> "$GITHUB_ENV"
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("MCCI_KEYSTORE"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes { release { signingConfig signingConfigs.release } }
          }
          GRADLE
      - name: Build the bundle
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: mcci-digital-${{ env.MCCI_FLAVOUR }}-${{ env.MCCI_APP_VERSION }}
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
